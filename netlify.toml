[build]
  command = "npm run build"
  publish = "dist/Web-Angular/browser"

[build.environment]
  NODE_VERSION = "24"

# Keep browser requests and HttpOnly session cookies on the frontend origin.
# API paths must be handled before the Angular SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://rony-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
